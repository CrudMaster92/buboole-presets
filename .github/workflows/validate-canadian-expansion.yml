name: Live Canadian employer validation

on:
  pull_request:
    paths:
      - companies/bmo/**
      - companies/cibc/**
      - companies/desjardins/**
      - companies/manulife/**
      - companies/sun-life/**
      - companies/intact-financial/**
      - companies/enbridge/**
      - companies/suncor/**
      - companies/cenovus/**
      - companies/canadian-tire/**
      - companies/atkinsrealis/**
      - companies/saputo/**
      - companies/finning/**
      - companies/thomson-reuters/**
      - companies/cae/**
      - companies/tc-energy/**
      - companies/restaurant-brands-international/**
      - companies/canada-goose/**
      - companies/element-fleet/**
      - companies/gfl-environmental/**
      - collections/canadian-employers-20261023.json
      - scripts/validate_public_collection.py
      - .github/workflows/validate-canadian-expansion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CrudMaster92/buboole-jobs
          ref: 651853357ad93ca29e0d696295df53af6682a4c6
          path: .runtime
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r .runtime/requirements-dev.txt
      - name: Verify pinned exported runtime
        working-directory: .runtime
        run: python -m server.public_jobs.export --destination . --check
      - name: Install Chromium for remote logo embedding checks
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          python -m playwright install --with-deps chromium
      - name: Validate Canadian collection through canonical runtime
        run: python scripts/validate_public_collection.py --catalog . --runtime .runtime --collection canadian-employers-20261023 --output validation-output --check-logos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canadian-expansion-live-validation
          path: validation-output/
          retention-days: 7
